<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repeticiones | WebMTX</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/playback.css">
</head>
<body>
    <header class="cabecera">
        <a class="marca" href="index.html">WebMTX</a>
        <nav class="nav" aria-label="Secciones">
            <a href="index.html">Inicio</a>
            <a href="broadcaster.html">Emitir</a>
            <a href="player.html">Ver</a>
            <a href="playback.html" aria-current="page">Repeticiones</a>
            <a href="stats.html">Estadísticas</a>
            <a href="api.html">API</a>
        </nav>
    </header>

    <!-- El tally de esta página refleja lo que hay en la salida de OBS (display.html) -->
    <div class="tally" id="tally" data-estado="inactivo" role="status" aria-live="polite">
        <span class="tally__lampara" aria-hidden="true"></span>
        <span class="tally__estado" id="tallyEstado">OBS vacío</span>
        <span class="tally__detalle" id="tallyDetalle">Nada en la salida de repeticiones</span>
        <span class="tally__tiempo" id="tallyTiempo"></span>
    </div>

    <main class="pagina pagina--app repeticiones">
        <h1 class="visualmente-oculto">Repeticiones</h1>

        <!-- Vídeo, línea temporal y salida a OBS -->
        <section class="rep__escenario" aria-label="Previsualización">
            <div class="monitor monitor--llenar">
                <video id="video" controls playsinline aria-label="Previsualización de la repetición"></video>
            </div>

            <div class="rep__info">
                <p class="rep__actual" id="currentRecording">Sin selección</p>
                <div class="rep__velocidad" role="group" aria-label="Velocidad de reproducción">
                    <button type="button" class="boton boton--peq boton--icono" onclick="cambiarVelocidad(-0.25)" aria-label="Más lento">−</button>
                    <button type="button" class="boton boton--peq" onclick="fijarVelocidad(0.5)">0,5×</button>
                    <button type="button" class="boton boton--peq" onclick="fijarVelocidad(1)">1×</button>
                    <button type="button" class="boton boton--peq" onclick="fijarVelocidad(1.5)">1,5×</button>
                    <button type="button" class="boton boton--peq" onclick="fijarVelocidad(2)">2×</button>
                    <button type="button" class="boton boton--peq boton--icono" onclick="cambiarVelocidad(0.25)" aria-label="Más rápido">+</button>
                    <span class="rep__velocidad-valor cifra" id="speedDisplay">1×</span>
                </div>
                <span class="cifra texto-2 texto-peq" id="timeDisplay">00:00 / 00:00</span>
            </div>

            <!-- Escala logarítmica: lo reciente (derecha) ocupa mucho más que lo
                 antiguo. El valor es una posición 0..1000, no segundos. -->
            <div class="linea-tiempo">
                <span class="cifra" id="timelineStart">--:--:--</span>
                <div class="linea-tiempo__pista">
                    <input type="range" id="timelineSlider" min="0" max="1000" value="1000" disabled aria-label="Buscar un momento de la grabación">
                    <div class="linea-tiempo__burbuja cifra" id="timelineBubble" aria-hidden="true">--:--:--</div>
                </div>
                <span class="cifra" id="timelineEnd">--:--:--</span>
            </div>
        </section>

        <!-- Qué reproducir -->
        <section class="rep__fuente panel columna-scroll" aria-labelledby="tituloFuente">
            <div class="panel__cabecera">
                <h2 id="tituloFuente">Qué repetir</h2>
                <span class="texto-2 texto-peq cifra" id="recordingCount">0 grabaciones</span>
            </div>
            <div class="pila">
                <div class="campo">
                    <label for="streamSelect">Cámara</label>
                    <select id="streamSelect" class="selector-camara" onchange="cambiarStream()"></select>
                </div>
                <div class="campo">
                    <label for="recordingSelect">Grabación</label>
                    <select id="recordingSelect" onchange="cambiarGrabacion()"></select>
                </div>
                <div class="campo">
                    <label for="playbackMode">Empezar</label>
                    <select id="playbackMode" onchange="actualizarModoPlayback()">
                        <option value="lookback">Hace unos segundos (sigue al directo)</option>
                        <option value="offset">Desde el inicio de la grabación</option>
                        <option value="specific">A una hora concreta</option>
                    </select>
                </div>

                <div class="campo" id="lookbackField">
                    <label for="lookbackTime">Desde hace <strong class="cifra" id="lookbackValue">30 seg</strong></label>
                    <div class="rango">
                        <input type="range" id="lookbackSlider" min="10" max="300" value="30" step="1" oninput="sincronizarDesdeSlider()" aria-label="Segundos hacia atrás">
                        <input type="number" id="lookbackTime" class="rep__numero" min="10" max="300" value="30" step="1" oninput="sincronizarDesdeNumero()" aria-label="Segundos hacia atrás (número)">
                    </div>
                    <div class="atajos" role="group" aria-label="Repetir al momento">
                        <button type="button" class="boton boton--peq" onclick="repetirAtajo(15)">Últimos 15 s</button>
                        <button type="button" class="boton boton--peq" onclick="repetirAtajo(30)">30 s</button>
                        <button type="button" class="boton boton--peq" onclick="repetirAtajo(60)">60 s</button>
                    </div>
                </div>

                <div class="campo" id="offsetField" hidden>
                    <label for="startOffset">Segundos desde el inicio</label>
                    <input type="number" id="startOffset" min="0" value="0" step="1">
                </div>

                <div class="campo" id="specificField" hidden>
                    <label for="specificTime">Hora (HH:MM o HH:MM:SS)</label>
                    <input type="text" id="specificTime" value="00:00:00" placeholder="HH:MM:SS" inputmode="numeric" spellcheck="false">
                </div>

                <button type="button" class="boton boton--primario boton--ancho" onclick="playFromOffset()">
                    <svg class="icono" aria-hidden="true"><use href="img/iconos.svg#play"/></svg>
                    Reproducir
                </button>
            </div>

            <!-- Siguiente paso tras previsualizar: mandarlo a OBS (display.html) -->
            <hr class="separador">
            <div class="salida-obs" aria-labelledby="tituloSalidaObs">
                <div class="salida-obs__texto">
                    <h2 id="tituloSalidaObs">Salida a OBS</h2>
                    <p class="salida-obs__pendiente texto-peq" id="obsPending" hidden></p>
                    <p class="salida-obs__estado texto-peq" id="obsStatus">En OBS: nada</p>
                </div>
                <!-- Cada botón solo está activo cuando su acción tiene sentido -->
                <div class="salida-obs__botones">
                    <button type="button" class="boton" id="quitarObsBtn" onclick="quitarDelDisplay()" disabled>
                        <svg class="icono" aria-hidden="true"><use href="img/iconos.svg#quitar"/></svg>
                        Quitar
                    </button>
                    <button type="button" class="boton boton--directo" id="enviarObsBtn" onclick="enviarAlDisplay()" disabled>
                        <svg class="icono" aria-hidden="true"><use href="img/iconos.svg#emitir"/></svg>
                        Enviar a OBS
                    </button>
                </div>
            </div>
        </section>

        <!-- Momentos marcados: se guardan en este navegador (localStorage) -->
        <aside class="rep__marcados panel columna-scroll" aria-labelledby="tituloMarcados">
            <div class="panel__cabecera">
                <h2 id="tituloMarcados">Momentos marcados</h2>
                <button type="button" class="boton boton--fantasma boton--peq" id="limpiarMarcados" onclick="borrarTodosLosMomentos()">Borrar todos</button>
            </div>

            <!-- Botón de pánico: marca lo que acaba de pasar sin tocar nada más.
                 El rótulo dice qué cámara y qué instante se marcaría ahora mismo. -->
            <button type="button" class="boton-marcar" onclick="marcarMomento()">
                <svg class="icono" aria-hidden="true"><use href="img/iconos.svg#marcar"/></svg>
                <span class="boton-marcar__titulo">Marcar</span>
                <span class="boton-marcar__destino cifra" id="marcarDestino">—</span>
            </button>

            <ul class="marcados" id="marcadosLista"></ul>
        </aside>
    </main>

    <script src="js/utils/utils.js"></script>
    <script src="js/utils/camaras.js"></script>
    <script src="js/utils/playback-utils.js"></script>
    <script src="js/ui/avisos.js"></script>
    <script src="js/ui/tally.js"></script>
    <script src="js/ui/playback-ui.js"></script>
    <script src="js/playback.js"></script>
    <script src="js/playback-marcados.js"></script>
    <script src="js/playback-control.js"></script>
</body>
</html>
