logLevel: info
logDestinations: [stdout, file]
logStructured: no
# Montado desde ./mediamtx/logs (ver docker-compose.yml). MediaMTX no rota el fichero.
logFile: /logs/mediamtx.log
sysLogPrefix: mediamtx

# Timeout of read operations.
readTimeout: 10s
writeTimeout: 10s

# Size of the queue of outgoing packets.
# A higher value allows to increase throughput, a lower value allows to save RAM.
writeQueueSize: 512
udpMaxPayloadSize: 1472
udpReadBufferSize: 0

# Command to run when a client dis/re/connects to the server.
runOnConnect:
runOnConnectRestart: no
runOnDisconnect:

###############################################
# Global settings -> Authentication

# Authentication method. Available values are:  internal, http, jwt.
authMethod: internal

# Internal authentication list of users.
authInternalUsers:
  # Username. 'any' means any user, including anonymous ones.
- user: any
  # Password. Not used in case of 'any' user.
  pass:
  # IPs or networks allowed to use this user. An empty list means any IP.
  ips: []
  permissions:
  - action: api
  - action: metrics
  - action: pprof
    # Available actions are: publish, read, playback, api, metrics, pprof.
  - action: publish
    # Paths can be set to further restrict access to a specific path. An empty path means any path.
    path:
  - action: read
    path:
  - action: playback
    path:

# HTTP-based authentication.
authHTTPAddress:
authHTTPExclude:
- action: api
- action: metrics
- action: pprof

# JWT-based authentication.
authJWTJWKS:
authJWTJWKSFingerprint:
authJWTClaimKey: mediamtx_permissions
authJWTExclude: []
authJWTInHTTPQuery: true

###############################################
# Global settings -> Control API

# Enable controlling the server through the Control API.
api: yes
apiAddress: :9997
apiEncryption: yes
apiServerKey: /server.key
apiServerCert: /server.crt
apiAllowOrigins: ['*']
apiTrustedProxies: []

###############################################
# Global settings -> Metrics

# Enable Prometheus-compatible metrics.
metrics: yes
metricsAddress: :9998
metricsEncryption: no
metricsServerKey: server.key
metricsServerCert: server.crt
metricsAllowOrigins: ['*']
metricsTrustedProxies: []

###############################################
# Global settings -> PPROF

# Enable pprof-compatible endpoint to monitor performances.
pprof: no
pprofAddress: :9999
pprofEncryption: no
pprofServerKey: server.key
pprofServerCert: server.crt
pprofAllowOrigins: ['*']
pprofTrustedProxies: []

################################################
# Global settings -> Playback server

# Enable downloading recordings from the playback server.
playback: yes
playbackAddress: :9996
playbackEncryption: yes
playbackServerKey: /server.key
playbackServerCert: /server.crt
playbackAllowOrigins: ['*']
playbackTrustedProxies: []

###############################################
# Global settings -> RTSP server

# Enable publishing and reading streams with the RTSP protocol.
rtsp: yes
rtspTransports: [udp, multicast, tcp]
rtspEncryption: "no"
rtspAddress: :8554
rtspsAddress: :8322
rtpAddress: :8000
rtcpAddress: :8001
multicastIPRange: 224.1.0.0/16
multicastRTPPort: 8002
multicastRTCPPort: 8003
srtpAddress: :8004
srtcpAddress: :8005
multicastSRTPPort: 8006
multicastSRTCPPort: 8007
rtspServerKey: server.key
rtspServerCert: server.crt
rtspAuthMethods: [basic]

###############################################
# Global settings -> RTMP server

# Enable publishing and reading streams with the RTMP protocol.
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"
rtmpsAddress: :1936
rtmpServerKey: server.key
rtmpServerCert: server.crt

###############################################
# Global settings -> HLS server

# Enable reading streams with the HLS protocol.
hls: yes
# Address of the HLS listener.
hlsAddress: :8888
hlsEncryption: yes
hlsServerKey: /server.key
hlsServerCert: /server.crt
hlsAllowOrigins: ['*']
hlsTrustedProxies: []
hlsAlwaysRemux: no
# Variant of the HLS protocol to use. Available options are: mpegts, fmp4, lowLatency.

hlsVariant: lowLatency
hlsSegmentCount: 7
# Minimum duration of each segment. A player usually puts 3 segments in a buffer before reproducing the stream.
hlsSegmentDuration: 1s
# Minimum duration of each part.
hlsPartDuration: 200ms
# Maximum size of each segment.This prevents RAM exhaustion.
hlsSegmentMaxSize: 50M
# Directory in which to save segments, instead of keeping them in the RAM.
hlsDirectory: ''
# The muxer will be closed when there are no reader requests and this amount of time has passed.
hlsMuxerCloseAfter: 60s

###############################################
# Global settings -> WebRTC server

# Enable publishing and reading streams with the WebRTC protocol.
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: yes
webrtcServerKey: /server.key
webrtcServerCert: /server.crt
webrtcAllowOrigins: ['*']
webrtcTrustedProxies: []
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ''
# Gather IPs from interfaces and send them to clients.
# webrtcIPsFromInterfaces: yes
webrtcIPsFromInterfaces: no
# List of interfaces whose IPs will be sent to clients.
# An empty value means to use all available interfaces.
webrtcIPsFromInterfacesList: []
# List of additional hosts or IPs to send to clients.
# Depende del equipo: NO se pone aquí. Se define en .env (WEBRTC_HOSTS) y
# docker-compose lo pasa como MTX_WEBRTCADDITIONALHOSTS, que sobrescribe este valor.
webrtcAdditionalHosts: []


webrtcICEServers2: []
webrtcHandshakeTimeout: 20s
webrtcTrackGatherTimeout: 2s
webrtcSTUNGatherTimeout: 20s




###############################################
# Global settings -> SRT server

# Enable publishing and reading streams with the SRT protocol.
srt: yes
srtAddress: :8890

###############################################
# Default path settings

# Settings in "pathDefaults" are applied anywhere,unless they are overridden in "paths".
pathDefaults:

  ###############################################
  # Default path settings -> General

  source: publisher
  sourceFingerprint:
  sourceOnDemand: no
  # If sourceOnDemand is "yes", readers will be put on hold until the source is ready or until this amount of time has passed.
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 10s
  # Maximum number of readers. Zero means no limit.
  maxReaders: 0
  srtReadPassphrase:
  # If the stream is not available, redirect readers to this path.
  fallback:
  # Use absolute timestamp of frames, instead of replacing them with the current time.
  useAbsoluteTimestamp: false

  ###############################################
  # Default path settings -> Record
  #
  # Estos valores se aplican a CUALQUIER cámara que publique (ver paths -> all_others).
  # Pensados para grabar varias cámaras durante un evento y hacer repeticiones en
  # directo desde el playback server (:9996). Coste de disco aproximado:
  #   GB/día ~= (bitrate_Mbps / 8) * 3600 * horas * nº_cámaras
  #   ej. 4 cámaras @ 5 Mbps, 8h -> ~72 GB/día  ->  con 7d de retención ~500 GB.
  # Las grabaciones viven en el volumen Docker recordings_volume
  # (exportarlas con scripts/exportar-grabaciones.ps1).

  record: yes
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  # Formato del segmento: fmp4 o mpegts.
  # OBLIGATORIO fmp4: el playback server solo permite seek por timestamp (repeticiones) con fMP4.
  recordFormat: fmp4
  # Cada cuánto se vuelca un "part" a disco. Marca cuán reciente puede ser una repetición:
  # con 1s, lo grabado hace ~1-2s ya es reproducible (el front deja 4s de margen).
  recordPartDuration: 1s
  recordMaxPartSize: 50M
  # Duración de cada FICHERO. El playback server cose segmentos en una línea temporal
  # continua, así que una repetición puede cruzar este límite sin cortes.
  # Para streams aún vivos, el playback server localiza el inicio leyendo las cabeceras
  # (moof) de cada part desde el principio del fichero: ficheros largos = repeticiones
  # lentas cerca del directo. Con 10m y parts de 1s son ~600 parts como máximo.
  recordSegmentDuration: 10m
  # Borra segmentos más antiguos que esto = ventana máxima de repetición hacia atrás.
  # Vigila el disco (ver cálculo arriba). 0s = no borrar nunca.
  recordDeleteAfter: 7d

  ###############################################
  # Default path settings -> Publisher source (when source is "publisher")
  # Allow another client to disconnect the current publisher and publish in its place.
  overridePublisher: yes
  srtPublishPassphrase:

  ###############################################
  # Default path settings -> RTSP source (when source is a RTSP or a RTSPS URL)
  rtspTransport: automatic
  rtspAnyPort: no
  rtspRangeType:
  rtspRangeStart:

  ###############################################
  # Default path settings -> RTP source (when source is RTP)
  # session description protocol (SDP) of the RTP stream.
  rtpSDP:

  ###############################################
  # Default path settings -> Redirect source (when source is "redirect")
  # path which clients will be redirected to.
  # It can be can be a relative path (i.e. /otherstream) or an absolute RTSP URL.
  sourceRedirect:


  ###############################################
  # Default path settings -> Hooks

  # Command to run when this path is initialized.
  runOnInit:
  # Restart the command if it exits.
  runOnInitRestart: no

  # Command to run when this path is requested by a reader and no one is publishing to this path yet.
  runOnDemand:
  # Restart the command if it exits.
  runOnDemandRestart: no
  # Readers will be put on hold until the runOnDemand command starts publishing
  # or until this amount of time has passed.
  runOnDemandStartTimeout: 10s
  # The command will be closed when there are no
  # readers connected and this amount of time has passed.
  runOnDemandCloseAfter: 10s
  # Command to run when there are no readers anymore.
  # Environment variables are the same of runOnDemand.
  runOnUnDemand:

  # Command to run when the stream is ready to be read, whenever it is published by a client or pulled from a server / camera.
  runOnReady:
  runOnReadyRestart: no
  # Command to run when the stream is not available anymore.
  # Environment variables are the same of runOnReady.
  runOnNotReady:

  # Command to run when a client starts reading.
  runOnRead:
  runOnReadRestart: no
  # Command to run when a client stops reading.
  runOnUnread:
  # Command to run when a recording segment is created.
  runOnRecordSegmentCreate:
  # Command to run when a recording segment is complete.
  runOnRecordSegmentComplete:

###############################################
# Path settings
paths:
  # Catch-all: acepta y graba CUALQUIER cámara que publique (cam1, cam2, movil...)
  # sin declararlas una a una. Hereda todo de pathDefaults (incluida la grabación),
  # que es la única fuente de verdad.
  #
  # Si una cámara necesita ajustes propios, declárala como un path aparte, p.ej.:
  #   cam_sala:
  #     recordDeleteAfter: 30d   # solo esta cámara se conserva 30 días
  #   cam_test:
  #     record: no               # esta no se graba
  all_others:
