# Configuración por equipo: copia .env.example a .env y ajústalo (ver README).
# Todas las variables tienen valor por defecto (WEBRTC_HOSTS es opcional).
# Solo se pasan a cada contenedor las variables que necesita (sin env_file).
services:
  server:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    hostname: server
    container_name: server
    ports:
      # El 80 solo redirige a HTTPS (desactivable con HTTP_REDIRECT=false).
      - "${PUERTO_HTTP:-80}:80"
      - "${PUERTO_HTTPS:-443}:443"
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./server
        target: /home/app
        read_only: false
      - type: volume
        source: node_modules_volume
        target: /home/app/node_modules
      # Datos que guarda la app (momentos marcados compartidos: marcados.json).
      # OJO: `docker compose down -v` también borra este volumen.
      - type: volume
        source: datos_volume
        target: /datos
    depends_on:
      - mediamtx
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - HTTP_REDIRECT=${HTTP_REDIRECT:-true}
      # Puerto HTTPS tal como lo ve el navegador (para el Location de la redirección)
      - PUERTO_HTTPS_PUBLICO=${PUERTO_HTTPS:-443}
      # Internas: nombre del servicio en la red de Docker (no tocar)
      - MEDIAMTX_HOST=mediamtx
      - DATOS_DIR=/datos
    networks:
      - tfg-network

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtxTFG
    restart: unless-stopped
    ports:
      - "1935:1935"      # RTMP
      - "8554:8554"      # RTSP
      - "8888:8888"      # HLS HTTPS
      - "8889:8889"      # WebRTC HTTPS
      - "8189:8189/udp"  # WebRTC ICE/UDP
      - "9997:9997"      # API HTTPS
    environment:
      # MediaMTX permite sobrescribir cualquier parámetro de mediamtx.yml con MTX_<PARÁMETRO>.
      # Lo que cambia según el equipo vive en .env, no en el yml.
      # IPs que MediaMTX anuncia para WebRTC. Opcional: nuestras páginas añaden la IP con la
      # que se abrieron (anadirCandidatoDelServidor). Solo hace falta para clientes WebRTC
      # externos (WHIP de OBS, ffmpeg...). MediaMTX exige al menos una: por defecto, 127.0.0.1.
      - MTX_WEBRTCADDITIONALHOSTS=${WEBRTC_HOSTS:-127.0.0.1}
      - MTX_PATHDEFAULTS_RECORDDELETEAFTER=${RETENCION_GRABACIONES:-7d}
      - MTX_LOGLEVEL=${NIVEL_LOG_MEDIAMTX:-info}
    volumes:
      - type: bind
        source: ./mediamtx/mediamtx.yml
        target: /mediamtx.yml
        read_only: false
      - type: bind
        source: ./server/key.pem
        target: /server.key
        read_only: true
      - type: bind
        source: ./server/cert.pem
        target: /server.crt
        read_only: true
      # Grabaciones en volumen NATIVO de Docker (no bind-mount de Windows): el acceso
      # aleatorio dentro del fMP4 es mucho más rápido y las repeticiones arrancan casi
      # al instante. Para sacar ficheros a Windows: scripts/exportar-grabaciones.ps1.
      # OJO: `docker compose down -v` borra este volumen (y con él las grabaciones).
      - type: volume
        source: recordings_volume
        target: /recordings
      - type: bind
        source: ./mediamtx/logs
        target: /logs
    networks:
      - tfg-network

networks:
  tfg-network:
    driver: bridge

volumes:
  node_modules_volume:
  recordings_volume:
  datos_volume:
